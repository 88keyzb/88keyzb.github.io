<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanities Immersive Tracker</title>
<link rel="stylesheet" href="../tufte.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<article>
<section>
  <h1>Humanities Immersive Tracker</h1>
  <p class="subtitle">13-week reading / listening / viewing course</p>
  <p>Based on <a href="https://www.honest-broker.com/p/a-12-month-immersive-course-in-humanities">Ted Gioia's 12-Month Immersive Course in Humanities</a>. Check items as you finish them. Progress saves automatically in this browser.</p>
  <div id="overall-wrap">
    <div id="overall-bar"><div id="overall-fill"></div></div>
    <div id="overall-text">0% complete</div>
  </div>
  <div class="controls">
    <button id="export-btn">Export JSON</button>
    <label id="import-label">Import JSON<input type="file" id="import-input" accept=".json,application/json" hidden></label>
    <button id="reset-btn">Reset</button>
  </div>
</section>
<section>
<main id="weeks"></main>
</section>
<section>
  <p>Progress saves automatically in this browser (localStorage).</p>
</section>
</article>
<script src="app.js"></script>
</body>
</html>
