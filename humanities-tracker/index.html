<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanities Immersive Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Humanities Immersive Tracker</h1>
  <p>13-week reading / listening / viewing course. Check items as you finish them.</p>
  <div id="overall-wrap">
    <div id="overall-bar"><div id="overall-fill"></div></div>
    <div id="overall-text">0% complete</div>
  </div>
  <div class="controls">
    <button id="export-btn">Export JSON</button>
    <label id="import-label">Import JSON<input type="file" id="import-input" accept=".json,application/json" hidden></label>
    <button id="reset-btn">Reset</button>
  </div>
</header>
<main id="weeks"></main>
<footer>
  <p>Progress saves automatically in this browser (localStorage).</p>
</footer>
<script src="app.js"></script>
</body>
</html>
